<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#f3f0e7"/>
  <rect x="32" y="32" width="1216" height="576" rx="28" fill="#111210"/>
  <text x="76" y="92" fill="#8f928a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" letter-spacing="3">COUNTERPROOF</text>
  <text x="76" y="176" fill="#f5f2e8" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="700">Your coding agent says</text>
  <text x="76" y="236" fill="#f5f2e8" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="700">it fixed the bug. Prove it.</text>
  <text x="76" y="286" fill="#a3a69e" font-family="Inter,Arial,sans-serif" font-size="20">Behavioral proof for agent-generated pull requests.</text>

  <rect x="76" y="338" width="1128" height="174" rx="16" fill="#1b1d1a" stroke="#3d403a"/>
  <text x="108" y="378" fill="#85887f" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">PR HEAD + CHANGED TESTS</text>
  <text x="453" y="378" fill="#b7e1bf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700">PASS</text>
  <text x="108" y="420" fill="#85887f" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">BASE + SAME TESTS</text>
  <text x="453" y="420" fill="#f0a28e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700">FAIL</text>
  <text x="108" y="462" fill="#85887f" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">PROOF INTEGRITY</text>
  <text x="453" y="462" fill="#b7e1bf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700">CLEAN</text>

  <rect x="790" y="370" width="354" height="104" rx="14" fill="#f2eee4"/>
  <text x="822" y="405" fill="#696c65" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">REGRESSION</text>
  <text x="822" y="447" fill="#111210" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="25" font-weight="700">WITNESSED</text>

  <text x="76" y="564" fill="#868980" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">Git history + your test runner · No LLM · No API key</text>
</svg>