[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-factory"
version = "0.1.0"
description = "Forge agent skills from real task failures, not imagination."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy"]
llm = ["openai>=1.0", "anthropic>=0.25"]

[project.scripts]
skill-factory = "skill_factory.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["skill_factory*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
