[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "counterproof"
version = "0.2.0"
description = "Falsifiable change control for self-modifying AI agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy"]
llm = ["openai>=1.0", "anthropic>=0.25"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
counterproof = "skill_factory.evolution.cli:cli"
evopr = "skill_factory.evolution.cli:cli"
skill-factory = "skill_factory.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["skill_factory*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.data-files]
"share/counterproof/site" = [
    "site/index.html",
    "site/app.js",
    "site/styles.css",
]
"share/counterproof/site/data" = [
    "site/data/evolution_cases.json",
    "site/data/capabilities.json",
]
