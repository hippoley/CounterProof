name: "Reality Probe: bring an agent PR"
description: "Submit an AI-assisted PR whose evidence you do not fully trust."
title: "[reality-probe] "
labels:
  - reality-probe
body:
  - type: markdown
    attributes:
      value: |
        ## Bring the uncertainty, not a feature request

        CounterProof Reality Lab starts from a real pull request and a concrete review question.

        You do **not** need to install CounterProof first.

  - type: input
    id: pr
    attributes:
      label: Pull request
      description: "Public PR URL preferred."
      placeholder: "https://github.com/owner/repo/pull/123"
    validations:
      required: true

  - type: textarea
    id: distrust
    attributes:
      label: What claim do you not trust?
      description: "Be specific: what does the PR or CI claim that still leaves you uncertain?"
      placeholder: |
        Example:
        The new regression test is green, but I do not know whether it would fail before the fix.
    validations:
      required: true

  - type: input
    id: claim_source
    attributes:
      label: Where did this claim or concern come from?
      description: "Optional. Link the PR description, review comment, issue, or other source that created the review question."
      placeholder: "https://github.com/owner/repo/pull/123#discussion_r..."

  - type: textarea
    id: existing_evidence
    attributes:
      label: What evidence already exists?
      description: "Optional. Exact tests, CI jobs, reproduction steps, screenshots, runner links, or product probes already available."
      placeholder: |
        Examples:
        tests/test_worker.py::test_configured_volume
        CI run: ...
        Product validator output: ...

  - type: textarea
    id: oracle
    attributes:
      label: What is the authoritative oracle, if there is one?
      description: "Optional. What product/runtime/provider behavior should the submitted test agree with?"
      placeholder: |
        Examples:
        claude plugin validate
        the live provider API response
        the browser-visible behavior
        no independent oracle known yet

  - type: textarea
    id: convince
    attributes:
      label: What evidence would convince you?
      description: "If you know. 'I don't know yet' is also useful."
      placeholder: |
        Example:
        The exact changed test failing on the base commit and passing on the PR head.
    validations:
      required: true

  - type: textarea
    id: review_work
    attributes:
      label: What review work should this evidence save?
      description: "Optional, but especially useful. Name the human check you hope not to repeat if the evidence is trustworthy."
      placeholder: |
        Examples:
        Re-run the same regression on BASE.
        Re-read a 500-line test log.
        Manually compare the submitted judge with the product parser.
        Nothing yet — I only want to know the evidence boundary.

  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: "Optional: environment, provider behavior, reviewer thread, production symptom, or known test-oracle concern."

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I understand a CounterProof result is evidence about the tested claim, not an automatic merge recommendation.
          required: true
