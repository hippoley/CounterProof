name: Reality — Bluefin 4539 QEMU replay existing candidates

on:
  # Historical fixed-candidate QEMU replay is retained for explicit
  # reproduction, not for every PR synchronization.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  e2e-control:
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@a99ca5ea0553f778a74f5d5152fefbbb47d86da4
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/ublue-os/bluefin@sha256:76aa5d6f4f2f3e18b244587bfbd45ae1777a7d0934f869534228eab6af1f0101
      suites: common
      compose_image: true
      test_repository: hippoley/CounterProof
      test_ref: 1c0a23317d420b77396770ae2a8fdf71804cde4e
    secrets: inherit

  e2e-bad:
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@a99ca5ea0553f778a74f5d5152fefbbb47d86da4
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/hippoley/counterproof-bluefin-4539:bad-36399042848
      suites: common
      compose_image: true
      test_repository: hippoley/CounterProof
      test_ref: 1c0a23317d420b77396770ae2a8fdf71804cde4e
    secrets: inherit

  e2e-revert:
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@a99ca5ea0553f778a74f5d5152fefbbb47d86da4
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/hippoley/counterproof-bluefin-4539:revert-36399042848
      suites: common
      compose_image: true
      test_repository: hippoley/CounterProof
      test_ref: 1c0a23317d420b77396770ae2a8fdf71804cde4e
    secrets: inherit
