name: Reality Probe · Metrolist 4097

on:
  push:
    branches:
      - probe/metrolist-4097
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counterproof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout CounterProof
        uses: actions/checkout@v4
        with:
          path: counterproof
          persist-credentials: false

      - name: Checkout external PR head
        uses: actions/checkout@v4
        with:
          repository: MetrolistGroup/Metrolist
          ref: 5cf7319678723c7bc690873045ba3d138591fe4c
          fetch-depth: 0
          path: target
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install CounterProof
        run: python -m pip install ./counterproof

      - name: Prepare changed-test adapter
        run: |
          cat > /tmp/run_metrolist_changed_tests.py <<'PY'
          from __future__ import annotations

          import pathlib
          import subprocess
          import sys

          paths = [pathlib.PurePosixPath(value) for value in sys.argv[1:]]
          prefix = pathlib.PurePosixPath("app/src/test/kotlin")
          classes = []
          for path in paths:
              try:
                  rel = path.relative_to(prefix)
              except ValueError:
                  raise SystemExit(f"unsupported changed test path: {path}")
              if rel.suffix != ".kt":
                  raise SystemExit(f"unsupported changed test extension: {path}")
              classes.append(".".join(rel.with_suffix("").parts))

          argv = [
              "./gradlew",
              "--console=plain",
              ":app:testFossDebugUnitTest",
              "--warning-mode",
              "summary",
          ]
          for class_name in classes:
              argv.extend(["--tests", class_name])

          print("COUNTERPROOF_EXTERNAL_TEST_ARGV=" + repr(argv), flush=True)
          raise SystemExit(subprocess.run(argv, check=False).returncode)
          PY

      - name: Run CounterProof against external Agent PR
        working-directory: target
        run: |
          chmod +x gradlew
          counterproof witness \
            --base f579f73bd4060b7997fb5fb9e302f9e3a2404947 \
            --test-command "python /tmp/run_metrolist_changed_tests.py {tests}" \
            --timeout 1200 \
            --out /tmp/METROLIST_4097_WITNESS.md \
            --json-out /tmp/METROLIST_4097_WITNESS.json
          cat /tmp/METROLIST_4097_WITNESS.md
          cat /tmp/METROLIST_4097_WITNESS.json

      - name: Upload reality-probe receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-4097-counterproof
          path: |
            /tmp/METROLIST_4097_WITNESS.md
            /tmp/METROLIST_4097_WITNESS.json
          if-no-files-found: warn
