name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check skill_factory/ tests/

      - name: Run tests
        run: pytest --cov=skill_factory --cov-report=term-missing

      - name: Run measured EvoPR replay
        run: |
          evopr replay examples/replay_suite.json --out /tmp/replay-results.json
          cat /tmp/replay-results.json

      - name: Audit capability truth table
        run: evopr audit

  clean-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel from repository
        run: |
          python -m pip install --upgrade pip
          pip wheel . --wheel-dir /tmp/evopr-wheel

      - name: Install wheel into clean virtualenv
        run: |
          python -m venv /tmp/evopr-clean
          /tmp/evopr-clean/bin/pip install /tmp/evopr-wheel/skill_factory-*.whl
          /tmp/evopr-clean/bin/evopr --help
          /tmp/evopr-clean/bin/evopr audit --json-output

      - name: Run packaged CLI against external packet
        run: |
          cd /tmp
          /tmp/evopr-clean/bin/evopr build "$GITHUB_WORKSPACE/examples/evolution_pr.json" --out /tmp/EVOLUTION_PR.md
          grep -q "Eligible for promotion" /tmp/EVOLUTION_PR.md

      - name: Run packaged trace-to-proof workflow
        run: |
          cd /tmp
          /tmp/evopr-clean/bin/evopr ingest \
            "$GITHUB_WORKSPACE/examples/traces/tenant_failure.json" \
            --surface policy \
            --out /tmp/EVOLUTION_PACKET.json
          grep -q '"selected_candidate_id": "C1"' /tmp/EVOLUTION_PACKET.json
          /tmp/evopr-clean/bin/evopr prove \
            "$GITHUB_WORKSPACE/examples/traces/tenant_failure.json" \
            --replay-manifest "$GITHUB_WORKSPACE/examples/replay_suite.json" \
            --surface policy \
            --out /tmp/TRACE_PROOF.md
          grep -q "Discriminating probes" /tmp/TRACE_PROOF.md
          grep -q "Eligible for promotion" /tmp/TRACE_PROOF.md

      - name: Run packaged active discrimination
        run: |
          cd /tmp
          /tmp/evopr-clean/bin/evopr discriminate \
            "$GITHUB_WORKSPACE/examples/traces/tenant_failure.json" \
            --experiment-manifest "$GITHUB_WORKSPACE/examples/discrimination_suite.json" \
            --surface policy \
            --surface skill \
            --surface prompt \
            --out /tmp/DISCRIMINATION.md \
            --json-out /tmp/DISCRIMINATION.json
          grep -q '"discriminated_surface": "policy"' /tmp/DISCRIMINATION.json
          grep -q "Only \*\*policy\*\* survived" /tmp/DISCRIMINATION.md

      - name: Run packaged active evolve workflow
        run: |
          cd /tmp
          /tmp/evopr-clean/bin/evopr evolve \
            "$GITHUB_WORKSPACE/examples/traces/tenant_failure.json" \
            --experiment-manifest "$GITHUB_WORKSPACE/examples/discrimination_suite.json" \
            --surface policy \
            --surface skill \
            --surface prompt \
            --out /tmp/EVOLUTION_REVIEW.md \
            --packet-out /tmp/EVOLVED_PACKET.json \
            --receipt-out /tmp/PROOF_RECEIPT.json
          grep -q '"selected_candidate_id": "C1"' /tmp/EVOLVED_PACKET.json
          grep -q '"discrimination_result": "unique-survivor:policy"' /tmp/EVOLVED_PACKET.json
          grep -q "Eligible for promotion" /tmp/EVOLUTION_REVIEW.md
          grep -q "EvoPR Discrimination Matrix" /tmp/EVOLUTION_REVIEW.md
          /tmp/evopr-clean/bin/evopr verify-receipt /tmp/PROOF_RECEIPT.json \
            --trace "$GITHUB_WORKSPACE/examples/traces/tenant_failure.json" \
            --experiment-manifest "$GITHUB_WORKSPACE/examples/discrimination_suite.json"
          cp "$GITHUB_WORKSPACE/examples/traces/tenant_failure.json" /tmp/changed-trace.json
          printf '\n ' >> /tmp/changed-trace.json
          if /tmp/evopr-clean/bin/evopr verify-receipt /tmp/PROOF_RECEIPT.json \
            --trace /tmp/changed-trace.json \
            --experiment-manifest "$GITHUB_WORKSPACE/examples/discrimination_suite.json"; then
            echo "Expected receipt verification to reject changed trace"
            exit 1
          fi

      - name: Run packaged ambiguity to next-probe workflow
        run: |
          cd /tmp
          /tmp/evopr-clean/bin/evopr evolve \
            "$GITHUB_WORKSPACE/examples/traces/tenant_failure.json" \
            --experiment-manifest "$GITHUB_WORKSPACE/examples/ambiguous_discrimination_suite.json" \
            --surface policy \
            --surface skill \
            --out /tmp/AMBIGUOUS_REVIEW.md \
            --packet-out /tmp/AMBIGUOUS_PACKET.json \
            --probe-plan-out /tmp/NEXT_PROBE.md
          grep -q '"selected_candidate_id": null' /tmp/AMBIGUOUS_PACKET.json
          grep -q '"discrimination_result": "ambiguous"' /tmp/AMBIGUOUS_PACKET.json
          grep -q "Separate policy from skill" /tmp/NEXT_PROBE.md
          grep -q "EvoPR Next Probe Plan" /tmp/AMBIGUOUS_REVIEW.md

      - name: Serve packaged interactive demo
        run: |
          test -f /tmp/evopr-clean/share/skill-factory/site/index.html
          cd /tmp
          /tmp/evopr-clean/bin/evopr demo --port 8877 >/tmp/evopr-demo.log 2>&1 &
          echo $! >/tmp/evopr-demo.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8877/ | grep -q "Behavior Proof" && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8877/data/capabilities.json | grep -q "command-replay"
          kill "$(cat /tmp/evopr-demo.pid)"

  validate-example-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate all example skills
        run: |
          for skill_dir in skills/*/; do
            echo "Validating $skill_dir ..."
            skill-factory validate "$skill_dir"
          done


  frontend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Check frontend JavaScript syntax
        run: node --check site/app.js

      - name: Serve EvoPR playground
        run: |
          python3 -m http.server 8765 --directory site >/tmp/evopr-http.log 2>&1 &
          echo $! >/tmp/evopr-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/evopr-http.log
          exit 1

      - name: Exercise worldline proof interaction in Chromium
        run: node tests/browser/evopr_smoke.mjs
