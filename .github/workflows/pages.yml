name: Deploy review demo

on:
  push:
    branches: [main]
    paths:
      - 'skill_factory/**'
      - 'skills/**'
      - 'site/**'
      - 'scripts/build_pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(
            curl -sS               -o /tmp/counterproof-pages.json               -w '%{http_code}'               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages"
          )"

          if [[ "$status" == "200" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled."
          elif [[ "$status" == "404" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages not enabled::Skipping deployment. Enable Pages for this repository with GitHub Actions as the source, then re-run this workflow."
          else
            echo "Unexpected GitHub Pages API status: $status" >&2
            cat /tmp/counterproof-pages.json >&2 || true
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/setup-python@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install, verify and test
        if: steps.pages.outputs.enabled == 'true'
        run: |
          pip install -e '.[dev]'
          ruff check skill_factory/ tests/
          pytest -q

      - name: Build review surface from repository skills
        if: steps.pages.outputs.enabled == 'true'
        run: python scripts/build_pages.py

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
