name: Reality — evidence freshness

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CounterProof
        run: python -m pip install -e .

      - name: Resolve effective evidence lifecycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          counterproof reality-lifecycle \
            examples/claim_matrix/reality-contracts.yml \
            --output effective-lifecycle.json

      - name: Upload lifecycle receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effective-evidence-lifecycle
          path: effective-lifecycle.json
          if-no-files-found: error
