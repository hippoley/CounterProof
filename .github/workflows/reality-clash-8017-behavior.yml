name: Reality probe - clash-verge-rev #8017 behavior

on:
  pull_request:
    paths:
      - '.github/workflows/reality-clash-8017-behavior.yml'

permissions:
  contents: read

jobs:
  behavior-replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: /tmp/counterproof-clash-target
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out CounterProof probe
        uses: actions/checkout@v4

      - name: Install Clash Verge Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust 1.98.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustc --version
          cargo --version

      - name: Fetch exact Clash Verge candidates
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/clash-verge-rev/clash-verge-rev.git \
            /tmp/clash-verge-rev
          git -C /tmp/clash-verge-rev fetch origin \
            b057bd964ccd156f68bc43a3a8ed66cf3cb1cd7b \
            2cb071998e2f14d76a5fbc3f4add5973e79cf138 \
            --depth=1

      - name: Write candidate-neutral production-side-effect probe
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/counterproof-probe.rs <<'RS'

          #[cfg(test)]
          mod counterproof_exit_save_behavior_probe {
              use super::Config;
              use crate::utils::dirs;
              use std::os::unix::fs::MetadataExt as _;

              fn inode(path: &std::path::Path) -> u64 {
                  std::fs::metadata(path).expect("metadata").ino()
              }

              #[tokio::test(flavor = "current_thread")]
              async fn counterproof_exit_save_behavior_probe() {
                  let app_home = dirs::app_home_dir().expect("app home");
                  let _ = std::fs::remove_dir_all(&app_home);
                  std::fs::create_dir_all(&app_home).expect("create isolated app home");

                  let clash = Config::clash().await;
                  let verge = Config::verge().await;
                  let profiles = Config::profiles().await;

                  clash.data_arc().save_config().await.expect("baseline clash");
                  verge.data_arc().save_file().await.expect("baseline verge");
                  profiles.data_arc().save_file().await.expect("baseline profiles");

                  let clash_path = dirs::clash_path().expect("clash path");
                  let verge_path = dirs::verge_path().expect("verge path");
                  let profiles_path = dirs::profiles_path().expect("profiles path");

                  let clash_before = inode(&clash_path);
                  let verge_before = inode(&verge_path);
                  let profiles_before = inode(&profiles_path);

                  // This is the production exit path under review.
                  Config::apply_all_and_save_file().await;

                  let clash_after = inode(&clash_path);
                  let verge_after = inode(&verge_path);
                  let profiles_after = inode(&profiles_path);

                  println!(
                      "CP_NO_DRAFT_CLASH_REPLACED={}",
                      clash_before != clash_after
                  );
                  println!(
                      "CP_NO_DRAFT_VERGE_REPLACED={}",
                      verge_before != verge_after
                  );
                  println!(
                      "CP_NO_DRAFT_PROFILES_REPLACED={}",
                      profiles_before != profiles_after
                  );

                  // Verify the shutdown safety net independently: a staged draft must
                  // still be committed and persisted by the same production exit path.
                  let verge = Config::verge().await;
                  verge.edit_draft(|draft| {
                      draft.theme_mode = Some("counterproof-behavior".into());
                  });

                  let staged_before = inode(&verge_path);
                  Config::apply_all_and_save_file().await;
                  let staged_after = inode(&verge_path);
                  let persisted = tokio::fs::read_to_string(&verge_path)
                      .await
                      .expect("read persisted verge config")
                      .contains("counterproof-behavior");

                  println!(
                      "CP_STAGED_VERGE_REPLACED={}",
                      staged_before != staged_after
                  );
                  println!("CP_STAGED_VERGE_PERSISTED={persisted}");

                  assert_ne!(
                      staged_before, staged_after,
                      "a staged draft must still trigger a physical file replacement"
                  );
                  assert!(
                      persisted,
                      "a staged draft must survive the production exit-save path"
                  );
              }
          }
          RS

      - name: HEAD - observe production exit behavior
        shell: bash
        run: |
          set -euo pipefail
          repo=/tmp/clash-verge-rev
          git -C "$repo" checkout --detach 2cb071998e2f14d76a5fbc3f4add5973e79cf138
          git -C "$repo" clean -fd
          cat /tmp/counterproof-probe.rs >> "$repo/src-tauri/src/config/config.rs"
          mkdir -p "$repo/src-tauri/sidecar"
          for bin in \
            clash-verge-service \
            clash-verge-service-install \
            clash-verge-service-uninstall \
            verge-mihomo \
            verge-mihomo-alpha
          do
            : > "$repo/src-tauri/sidecar/${bin}-x86_64-unknown-linux-gnu"
            chmod +x "$repo/src-tauri/sidecar/${bin}-x86_64-unknown-linux-gnu"
          done
          mkdir -p "$repo/src-tauri/resources"
          mkdir -p "$repo/dist"
          printf '<!doctype html><title>CounterProof probe</title>\n' > "$repo/dist/index.html"

          rm -rf /tmp/counterproof-clash-head
          mkdir -p /tmp/counterproof-clash-head
          cd "$repo"
          XDG_DATA_HOME=/tmp/counterproof-clash-head \
            cargo test -p clash-verge --lib counterproof_exit_save_behavior_probe \
              -- --nocapture --test-threads=1 2>&1 | tee /tmp/head-behavior.log

      - name: BASE - observe same production exit behavior
        shell: bash
        run: |
          set -euo pipefail
          repo=/tmp/clash-verge-rev
          git -C "$repo" checkout --detach b057bd964ccd156f68bc43a3a8ed66cf3cb1cd7b
          git -C "$repo" clean -fd
          cat /tmp/counterproof-probe.rs >> "$repo/src-tauri/src/config/config.rs"
          mkdir -p "$repo/src-tauri/sidecar"
          for bin in \
            clash-verge-service \
            clash-verge-service-install \
            clash-verge-service-uninstall \
            verge-mihomo \
            verge-mihomo-alpha
          do
            : > "$repo/src-tauri/sidecar/${bin}-x86_64-unknown-linux-gnu"
            chmod +x "$repo/src-tauri/sidecar/${bin}-x86_64-unknown-linux-gnu"
          done
          mkdir -p "$repo/src-tauri/resources"
          mkdir -p "$repo/dist"
          printf '<!doctype html><title>CounterProof probe</title>\n' > "$repo/dist/index.html"

          rm -rf /tmp/counterproof-clash-base
          mkdir -p /tmp/counterproof-clash-base
          cd "$repo"
          XDG_DATA_HOME=/tmp/counterproof-clash-base \
            cargo test -p clash-verge --lib counterproof_exit_save_behavior_probe \
              -- --nocapture --test-threads=1 2>&1 | tee /tmp/base-behavior.log

      - name: Classify behavior-level evidence
        shell: python
        run: |
          from pathlib import Path

          head = Path("/tmp/head-behavior.log").read_text(errors="replace")
          base = Path("/tmp/base-behavior.log").read_text(errors="replace")

          def value(log: str, key: str) -> bool:
              needle = key + "="
              hits = [line.strip() for line in log.splitlines() if line.strip().startswith(needle)]
              if not hits:
                  raise SystemExit(f"missing {key}")
              raw = hits[-1].split("=", 1)[1].strip().lower()
              if raw not in {"true", "false"}:
                  raise SystemExit(f"invalid {key}: {raw}")
              return raw == "true"

          keys = [
              "CP_NO_DRAFT_CLASH_REPLACED",
              "CP_NO_DRAFT_VERGE_REPLACED",
              "CP_NO_DRAFT_PROFILES_REPLACED",
          ]

          head_idle = {k: value(head, k) for k in keys}
          base_idle = {k: value(base, k) for k in keys}
          head_staged_write = value(head, "CP_STAGED_VERGE_REPLACED")
          base_staged_write = value(base, "CP_STAGED_VERGE_REPLACED")
          head_staged_persisted = value(head, "CP_STAGED_VERGE_PERSISTED")
          base_staged_persisted = value(base, "CP_STAGED_VERGE_PERSISTED")

          print("HEAD_NO_DRAFT:", head_idle)
          print("BASE_NO_DRAFT:", base_idle)
          print("HEAD_STAGED_WRITE:", head_staged_write)
          print("BASE_STAGED_WRITE:", base_staged_write)
          print("HEAD_STAGED_PERSISTED:", head_staged_persisted)
          print("BASE_STAGED_PERSISTED:", base_staged_persisted)

          head_idle_clean = not any(head_idle.values())
          base_idle_rewrites = all(base_idle.values())
          safety_net_preserved = all([
              head_staged_write,
              base_staged_write,
              head_staged_persisted,
              base_staged_persisted,
          ])

          if head_idle_clean and base_idle_rewrites and safety_net_preserved:
              print("COUNTERPROOF_REALITY_RESULT=WITNESSED_BEHAVIOR")
              print(
                  "INTERPRETATION=The same candidate-neutral probe executes the production "
                  "Config::apply_all_and_save_file path on exact BASE and HEAD. BASE physically "
                  "replaces all three config files with no staged drafts; HEAD leaves them "
                  "untouched. A staged verge draft is still physically replaced and persisted."
              )
          else:
              print("COUNTERPROOF_REALITY_RESULT=INCONCLUSIVE")
              raise SystemExit(
                  "Observed results did not establish the intended production-side-effect delta."
              )
