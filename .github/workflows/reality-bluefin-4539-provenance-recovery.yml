name: Reality — Bluefin 4539 provenance recovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "reality/bluefin-4539/candidates.yml"
      - ".github/workflows/reality-bluefin-4539-provenance-recovery.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  attestations: read

jobs:
  recover-provenance:
    runs-on: ubuntu-latest
    env:
      TARGET_DIGEST: sha256:2ade0f897499dd488a4f59c4bbe50002228e3b683938333ce119be4e748fe1f5
      PRODUCER_REPO: ublue-os/main
      PRODUCER_RUN: "26322931886"
      PRODUCER_SHA: 0273c246618919cf48a3c71a67d1c68aed209b24
    steps:
      - uses: actions/checkout@v4

      - name: Probe GitHub artifact attestation
        id: attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          url="https://api.github.com/repos/$PRODUCER_REPO/attestations/$TARGET_DIGEST"
          code=$(curl -sS -o attestation.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$url")
          echo "http_status=$code" >>"$GITHUB_OUTPUT"
          if [[ "$code" == "200" ]]; then
            echo "status=AVAILABLE" >>"$GITHUB_OUTPUT"
          else
            echo "status=UNAVAILABLE" >>"$GITHUB_OUTPUT"
          fi
          jq . attestation.json 2>/dev/null || cat attestation.json

      - name: Probe GHCR package metadata for deleted subject
        id: package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          found=false
          : > package-matches.jsonl
          for page in 1 2 3 4 5; do
            code=$(curl -sS -o "package-page-$page.json" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/ublue-os/packages/container/silverblue-main/versions?per_page=100&page=$page")
            if [[ "$code" != "200" ]]; then
              echo "package API page $page HTTP $code"
              break
            fi
            jq -c --arg digest "$TARGET_DIGEST" \
              '.[] | select((.name == $digest) or (.metadata.container.tags[]? == $digest))' \
              "package-page-$page.json" >> package-matches.jsonl
            if [[ -s package-matches.jsonl ]]; then
              found=true
              break
            fi
            count=$(jq 'length' "package-page-$page.json")
            [[ "$count" -lt 100 ]] && break
          done
          echo "match=$found" >>"$GITHUB_OUTPUT"
          if [[ "$found" == "true" ]]; then
            echo "status=METADATA_FOUND" >>"$GITHUB_OUTPUT"
            cat package-matches.jsonl
          else
            echo "status=NO_METADATA_MATCH" >>"$GITHUB_OUTPUT"
          fi

      - name: Freeze producer run and source metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$PRODUCER_REPO/actions/runs/$PRODUCER_RUN" \
            > producer-run.json
          curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$PRODUCER_REPO/commits/$PRODUCER_SHA" \
            > producer-commit.json

      - name: Build provenance recovery receipt
        shell: bash
        env:
          ATTESTATION_STATUS: ${{ steps.attestation.outputs.status }}
          ATTESTATION_HTTP: ${{ steps.attestation.outputs.http_status }}
          PACKAGE_STATUS: ${{ steps.package.outputs.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(Path("producer-run.json").read_text())
          commit = json.loads(Path("producer-commit.json").read_text())
          attestation = {}
          try:
              attestation = json.loads(Path("attestation.json").read_text())
          except Exception:
              pass

          subject = os.environ["TARGET_DIGEST"]
          attestation_status = os.environ["ATTESTATION_STATUS"]
          package_status = os.environ["PACKAGE_STATUS"]

          if attestation_status == "AVAILABLE":
              recovery = "ATTESTATION_RECOVERED"
          elif package_status == "METADATA_FOUND":
              recovery = "PACKAGE_METADATA_RECOVERED"
          else:
              recovery = "BUILD_PROVENANCE_ONLY"

          receipt = {
              "schema_version": 1,
              "case": "ublue-os/bluefin#4539",
              "subject": f"ghcr.io/ublue-os/silverblue-main@{subject}",
              "recovery_level": recovery,
              "attestation": {
                  "status": attestation_status,
                  "http_status": os.environ["ATTESTATION_HTTP"],
                  "bundle_count": len(attestation.get("attestations", []))
                  if isinstance(attestation, dict)
                  else 0,
              },
              "package_metadata": {"status": package_status},
              "producer": {
                  "repository": os.environ["PRODUCER_REPO"],
                  "workflow_run": int(os.environ["PRODUCER_RUN"]),
                  "workflow_run_url": run.get("html_url"),
                  "workflow_head_sha": run.get("head_sha"),
                  "workflow_event": run.get("event"),
                  "workflow_conclusion": run.get("conclusion"),
                  "workflow_created_at": run.get("created_at"),
                  "source_commit": os.environ["PRODUCER_SHA"],
                  "source_commit_message": commit.get("commit", {}).get("message"),
              },
              "claim_boundary": (
                  "Attestation/package metadata can recover immutable subject provenance "
                  "but does not restore deleted OCI layers."
              ),
          }
          Path("bluefin-4539-provenance-recovery.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("## Bluefin #4539 provenance recovery\n\n")
              fh.write(f"- recovery level: **{recovery}**\n")
              fh.write(f"- attestation: `{attestation_status}`\n")
              fh.write(f"- package metadata: `{package_status}`\n")
              fh.write(f"- producer run: `{run.get('html_url')}`\n")
              fh.write(f"- producer head SHA: `{run.get('head_sha')}`\n")
          PY

      - name: Upload provenance recovery receipt
        uses: actions/upload-artifact@v4
        with:
          name: bluefin-4539-provenance-recovery
          path: |
            bluefin-4539-provenance-recovery.json
            attestation.json
            package-matches.jsonl
            producer-run.json
            producer-commit.json
          if-no-files-found: error
