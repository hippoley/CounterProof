name: Reality Probe · Prefect 22698

on:
  push:
    branches:
      - probe/prefect-22698
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counterproof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CounterProof
        uses: actions/checkout@v4
        with:
          path: counterproof
          persist-credentials: false

      - name: Checkout Prefect PR head
        uses: actions/checkout@v4
        with:
          repository: PrefectHQ/prefect
          ref: 7604947bcaaec12a83505f842fbc6adb1b88275e
          fetch-depth: 0
          path: target
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install CounterProof
        run: python -m pip install ./counterproof

      - name: Install Prefect Docker focused test environment
        working-directory: target/src/integrations/prefect-docker
        run: uv sync --group dev

      - name: Prepare structured focused-pytest adapter
        run: |
          cat > /tmp/prefect_22698_adapter.py <<'PY'
          from __future__ import annotations

          import json
          import os
          import pathlib
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          changed = [pathlib.PurePosixPath(x) for x in sys.argv[1:]]
          target = pathlib.PurePosixPath("src/integrations/prefect-docker/tests/test_worker.py")
          if target not in changed:
              print(f"expected changed test {target}, got {changed}", file=sys.stderr)
              raise SystemExit(2)

          side = os.environ.get("COUNTERPROOF_WITNESS_SIDE", "unknown")
          xml_path = pathlib.Path(f"/tmp/prefect-22698-{side}.xml")
          if xml_path.exists():
              xml_path.unlink()

          argv = [
              "uv", "run",
              "--project", "src/integrations/prefect-docker",
              "pytest",
              "-q",
              "src/integrations/prefect-docker/tests/test_worker.py",
              "-k",
              "test_submit_adhoc_run_uses_work_pool_default_volumes or test_submit_adhoc_run_preserves_configured_volumes",
              "--junitxml", str(xml_path),
              "-o", "addopts=",
          ]
          proc = subprocess.run(argv, text=True, capture_output=True, check=False)
          print(proc.stdout)
          print(proc.stderr, file=sys.stderr)

          if not xml_path.exists():
              print("pytest produced no JUnit XML", file=sys.stderr)
              raise SystemExit(proc.returncode or 2)

          root = ET.parse(xml_path).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          tests = sum(int(s.attrib.get("tests", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
          skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)

          if proc.returncode == 0 and tests > 0:
              verdict = "pass"
          elif failures > 0 and errors == 0:
              verdict = "fail"
          else:
              print(
                  f"pytest did not yield behavioral evidence: rc={proc.returncode} "
                  f"tests={tests} failures={failures} errors={errors}",
                  file=sys.stderr,
              )
              raise SystemExit(proc.returncode or 2)

          print("COUNTERPROOF_RESULT=" + json.dumps({
              "verdict": verdict,
              "metrics": {
                  "returncode": proc.returncode,
                  "tests": tests,
                  "failures": failures,
                  "errors": errors,
                  "skipped": skipped,
              },
              "observations": [
                  "Focused Prefect Docker regression tests reached pytest execution."
              ],
          }))
          raise SystemExit(0)
          PY

      - name: Replay reviewer-requested regression coverage
        working-directory: target
        run: |
          counterproof witness \
            --base ef4286181588e579f72854d9344f4a2f6d66a090 \
            --test-command "python /tmp/prefect_22698_adapter.py {tests}" \
            --result-protocol json-v1 \
            --timeout 600 \
            --out /tmp/PREFECT_22698_WITNESS.md \
            --json-out /tmp/PREFECT_22698_WITNESS.json
          cat /tmp/PREFECT_22698_WITNESS.md
          cat /tmp/PREFECT_22698_WITNESS.json
          echo "=== HEAD JUNIT ==="
          cat /tmp/prefect-22698-head.xml
          echo "=== BASE JUNIT ==="
          cat /tmp/prefect-22698-base-with-head-tests.xml

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prefect-22698-counterproof
          path: |
            /tmp/PREFECT_22698_WITNESS.md
            /tmp/PREFECT_22698_WITNESS.json
            /tmp/prefect-22698-*.xml
          if-no-files-found: warn
