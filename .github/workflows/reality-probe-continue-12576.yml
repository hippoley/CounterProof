name: Reality Probe · continue 12576

on:
  push:
    branches:
      - probe/continue-12576
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counterproof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CounterProof candidate
        uses: actions/checkout@v4
        with:
          repository: hippoley/CounterProof
          ref: fix/monorepo-dependency-closure
          path: counterproof
          persist-credentials: false

      - name: Checkout Continue PR head
        uses: actions/checkout@v4
        with:
          repository: continuedev/continue
          ref: 0f2e62e54b6f5bc2bc749e22e15b0dd5342bde2a
          fetch-depth: 0
          path: target
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.1"

      - name: Install CounterProof
        run: python -m pip install ./counterproof

      - name: Install Continue dependencies
        working-directory: target
        run: |
          npm ci --ignore-scripts
          node ./scripts/build-packages.js
          cd core
          npm ci --ignore-scripts

      - name: Prepare structured Vitest adapter
        run: |
          cat > /tmp/continue_vitest_adapter.py <<'PY'
          from __future__ import annotations

          import json
          import os
          import pathlib
          import subprocess
          import sys

          tests = []
          for raw in sys.argv[1:]:
              path = pathlib.PurePosixPath(raw)
              try:
                  rel = path.relative_to("core")
              except ValueError:
                  print(f"unsupported changed test outside core: {raw}", file=sys.stderr)
                  raise SystemExit(2)
              tests.append(str(rel))

          side = os.environ.get("COUNTERPROOF_WITNESS_SIDE", "unknown")
          result_file = pathlib.Path(f"/tmp/continue-vitest-{side}.json")
          if result_file.exists():
              result_file.unlink()

          argv = [
              "npx", "vitest", "run", *tests,
              "--reporter=json",
              f"--outputFile={result_file}",
          ]
          proc = subprocess.run(
              argv,
              cwd="core",
              text=True,
              capture_output=True,
              check=False,
          )
          print(proc.stdout)
          print(proc.stderr, file=sys.stderr)

          if not result_file.exists():
              print("Vitest produced no structured result file.", file=sys.stderr)
              raise SystemExit(proc.returncode or 2)

          try:
              payload = json.loads(result_file.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"Could not parse Vitest JSON: {exc}", file=sys.stderr)
              raise SystemExit(2)

          failed = int(payload.get("numFailedTests", 0))
          passed = int(payload.get("numPassedTests", 0))
          total = int(payload.get("numTotalTests", passed + failed))

          if failed > 0:
              verdict = "fail"
          elif proc.returncode == 0 and total > 0:
              verdict = "pass"
          else:
              print(
                  f"Vitest did not yield a behavioral verdict: rc={proc.returncode}, total={total}",
                  file=sys.stderr,
              )
              raise SystemExit(proc.returncode or 2)

          print("COUNTERPROOF_RESULT=" + json.dumps({
              "verdict": verdict,
              "metrics": {
                  "returncode": proc.returncode,
                  "total": total,
                  "passed": passed,
                  "failed": failed,
              },
              "observations": [
                  "Vitest JSON reporter reached test execution.",
              ],
          }))
          raise SystemExit(0)
          PY

      - name: Run CounterProof on Continue PR 12576
        working-directory: target
        run: |
          counterproof witness \
            --base a3076b444af3fb0d9fd3805c10f75177d8f70137 \
            --test-command "python /tmp/continue_vitest_adapter.py {tests}" \
            --result-protocol json-v1 \
            --timeout 600 \
            --out /tmp/CONTINUE_12576_WITNESS.md \
            --json-out /tmp/CONTINUE_12576_WITNESS.json
          cat /tmp/CONTINUE_12576_WITNESS.md
          cat /tmp/CONTINUE_12576_WITNESS.json

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continue-12576-counterproof
          path: |
            /tmp/CONTINUE_12576_WITNESS.md
            /tmp/CONTINUE_12576_WITNESS.json
            /tmp/continue-vitest-*.json
          if-no-files-found: warn
