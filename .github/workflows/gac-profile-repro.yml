name: GAC 3.2.4 upstream reproducer
on:
  push:
    branches:
      - evidence/gac-profile-validation-2026-11-04
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install official published versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'openadr3-client==2.4.2' 'openadr3-client-gac-compliance==3.2.4' 'pytest>=9,<10'
      - name: Reproduce failures on unmodified release
        shell: bash
        run: |
          set +e
          python -m pytest -q research/gac_profile/test_regressions.py > baseline.log 2>&1
          result=$?
          set -e
          cat baseline.log
          if [ "$result" -ne 1 ]; then
            echo "Expected pytest assertion failures on 3.2.4; got status=$result"
            exit 1
          fi
          grep -q 'FAILED' baseline.log || exit 1
      - name: Apply bounded candidate fixes to runner's installed release
        run: python research/gac_profile/apply_fix.py
      - name: Verify regressions on corrected release
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q research/gac_profile/test_regressions.py | tee patched.log
      - name: Check out upstream source at its published tag
        uses: actions/checkout@v4
        with:
          repository: ElaadNL/openadr3-client-gac-compliance
          ref: 3.2.4
          path: upstream
          persist-credentials: false
      - name: Run upstream GAC 2.0 and 2.1 domain unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q upstream/tests/domain/gac20 upstream/tests/domain/gac21 | tee upstream-tests.log
      - name: Generate reviewable unified diff against release tag
        run: |
          python research/gac_profile/apply_fix.py upstream
          git -C upstream diff --no-ext-diff > gac-3.2.4-candidate.patch
          test -s gac-3.2.4-candidate.patch
          echo "Patch lines: $(wc -l < gac-3.2.4-candidate.patch)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gac-3.2.4-evidence-and-candidate-patch
          path: |
            baseline.log
            patched.log
            upstream-tests.log
            gac-3.2.4-candidate.patch
