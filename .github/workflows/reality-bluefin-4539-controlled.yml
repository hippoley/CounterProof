name: Reality — Bluefin 4539 controlled causal replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "reality/bluefin-4539/controlled/**"
      - ".github/workflows/reality-bluefin-4539-controlled.yml"

permissions:
  contents: read
  packages: write

env:
  CONTROL_BASE: ghcr.io/ublue-os/bluefin@sha256:76aa5d6f4f2f3e18b244587bfbd45ae1777a7d0934f869534228eab6af1f0101

jobs:
  build-candidates:
    runs-on: ubuntu-latest
    outputs:
      bad_image: ${{ steps.refs.outputs.bad_image }}
      revert_image: ${{ steps.refs.outputs.revert_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Freeze candidate refs
        id: refs
        shell: bash
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          bad="ghcr.io/$owner/counterproof-bluefin-4539:bad-${{ github.run_id }}"
          revert="ghcr.io/$owner/counterproof-bluefin-4539:revert-${{ github.run_id }}"
          echo "bad_image=$bad" >>"$GITHUB_OUTPUT"
          echo "revert_image=$revert" >>"$GITHUB_OUTPUT"

      - name: Assert control does not already contain intervention
        shell: bash
        run: |
          docker pull "$CONTROL_BASE"
          if docker run --rm "$CONTROL_BASE"             test -e /usr/lib/systemd/user/xdg-desktop-portal.service.d/30-after-keyring.conf; then
            echo "::error::Frozen control already contains the historical intervention"
            exit 1
          fi

      - name: Build and push BAD candidate
        shell: bash
        working-directory: reality/bluefin-4539/controlled
        run: |
          docker build             --build-arg CONTROL_BASE="$CONTROL_BASE"             -f Containerfile.bad             -t "${{ steps.refs.outputs.bad_image }}" .
          docker push "${{ steps.refs.outputs.bad_image }}"

      - name: Build and push REVERT candidate
        shell: bash
        working-directory: reality/bluefin-4539/controlled
        run: |
          docker build             --build-arg BAD_IMAGE="${{ steps.refs.outputs.bad_image }}"             -f Containerfile.revert             -t "${{ steps.refs.outputs.revert_image }}" .
          docker push "${{ steps.refs.outputs.revert_image }}"

      - name: Verify intervention state in all candidates
        shell: bash
        run: |
          set -euo pipefail
          path=/usr/lib/systemd/user/xdg-desktop-portal.service.d/30-after-keyring.conf

          if docker run --rm "$CONTROL_BASE" test -e "$path"; then
            echo "::error::CONTROL unexpectedly contains intervention"
            exit 1
          fi

          bad_content="$(docker run --rm "${{ steps.refs.outputs.bad_image }}" cat "$path")"
          printf '%s\n' "$bad_content"
          grep -Fx 'After=gnome-keyring-daemon.service' <<<"$bad_content"
          grep -Fx 'Wants=gnome-keyring-daemon.service' <<<"$bad_content"

          if docker run --rm "${{ steps.refs.outputs.revert_image }}" test -e "$path"; then
            echo "::error::REVERT still contains intervention"
            exit 1
          fi

      - name: Publish construction receipt
        shell: bash
        run: |
          {
            echo '## Controlled candidate construction'
            echo
            echo "- CONTROL: $CONTROL_BASE"
            echo "- BAD: ${{ steps.refs.outputs.bad_image }}"
            echo "- REVERT: ${{ steps.refs.outputs.revert_image }}"
            echo
            echo 'Only the historical 30-after-keyring.conf intervention is added and then removed.'
          } >>"$GITHUB_STEP_SUMMARY"

  e2e-control:
    needs: build-candidates
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/ublue-os/bluefin@sha256:76aa5d6f4f2f3e18b244587bfbd45ae1777a7d0934f869534228eab6af1f0101
      suites: common
      compose_image: true
      test_repository: hippoley/CounterProof
      test_ref: 8b206d4f461c21e85adf555145eb33ce6928edfe
    secrets: inherit

  e2e-bad:
    needs: build-candidates
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    permissions:
      contents: read
      packages: write
    with:
      image: ${{ needs.build-candidates.outputs.bad_image }}
      suites: common
      compose_image: true
      test_repository: hippoley/CounterProof
      test_ref: 8b206d4f461c21e85adf555145eb33ce6928edfe
    secrets: inherit

  e2e-revert:
    needs: build-candidates
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    permissions:
      contents: read
      packages: write
    with:
      image: ${{ needs.build-candidates.outputs.revert_image }}
      suites: common
      compose_image: true
      test_repository: hippoley/CounterProof
      test_ref: 8b206d4f461c21e85adf555145eb33ce6928edfe
    secrets: inherit


  causal-receipt:
    if: always()
    needs: [build-candidates, e2e-control, e2e-bad, e2e-revert]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download E2E result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-*
          path: replay-results
          merge-multiple: true

      - name: Build three-candidate causal receipt
        shell: bash
        env:
          CONTROL_IMAGE: ghcr.io/ublue-os/bluefin@sha256:76aa5d6f4f2f3e18b244587bfbd45ae1777a7d0934f869534228eab6af1f0101
          BAD_IMAGE: ${{ needs.build-candidates.outputs.bad_image }}
          REVERT_IMAGE: ${{ needs.build-candidates.outputs.revert_image }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("replay-results")
          files = sorted(root.rglob("counterproof-keyring-diagnostic-*.json"))
          if not files:
              raise SystemExit("No CounterProof keyring diagnostic artifacts found")

          by_image = {}
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              by_image[data["image"]] = data["snapshot"]

          roles = {
              "CONTROL": os.environ["CONTROL_IMAGE"],
              "BAD": os.environ["BAD_IMAGE"],
              "REVERT": os.environ["REVERT_IMAGE"],
          }

          def get(role):
              image = roles[role]
              if image not in by_image:
                  raise SystemExit(f"Missing diagnostic for {role}: {image}")
              return by_image[image]

          def unit_state(s):
              text = s["keyring_unit"]["stdout"]
              return {
                  "active": "ActiveState=active" in text,
                  "pid_nonzero": "MainPID=0" not in text,
              }

          def has_dep(s):
              return "gnome-keyring-daemon.service" in s["portal_dependencies"]["stdout"]

          def has_late_error(s):
              return "NotInInitialization" in s["keyring_journal"]["stdout"]

          def row(role):
              s = get(role)
              u = unit_state(s)
              return {
                  "image": roles[role],
                  "keyring_unit_active": u["active"],
                  "keyring_pid_nonzero": u["pid_nonzero"],
                  "portal_wants_keyring": has_dep(s),
                  "not_in_initialization": has_late_error(s),
                  "login_alias": s["secret_login_alias"]["stdout"],
              }

          receipt = {role: row(role) for role in roles}
          expected = {
              "CONTROL": (False, False, False),
              "BAD": (True, True, True),
              "REVERT": (False, False, False),
          }

          def signature(row):
              return (
                  row["keyring_unit_active"],
                  row["portal_wants_keyring"],
                  row["not_in_initialization"],
              )

          observed = {role: signature(receipt[role]) for role in roles}
          controlled_causal_witness = all(observed[r] == expected[r] for r in roles)

          verdict = (
              "WITNESSED_CONTROLLED_CAUSAL"
              if controlled_causal_witness
              else "INCONCLUSIVE_CONTROLLED_CAUSAL"
          )

          out = {
              "schema_version": 1,
              "case": "ublue-os/bluefin#4539",
              "experiment": "CONTROL -> + historical drop-in -> BAD -> remove drop-in -> REVERT",
              "oracle_revision": "8b206d4f461c21e85adf555145eb33ce6928edfe",
              "historical_image_status": "ORIGINAL_REGISTRY_ARTIFACTS_UNAVAILABLE",
              "verdict": verdict,
              "candidates": receipt,
          }

          Path("bluefin-4539-controlled-receipt.json").write_text(
              json.dumps(out, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(json.dumps(out, indent=2, sort_keys=True))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("## Bluefin #4539 controlled causal receipt\n\n")
              fh.write(f"**Verdict: {verdict}**\n\n")
              fh.write("| candidate | keyring unit active | portal→keyring dependency | NotInInitialization |\n")
              fh.write("|---|---:|---:|---:|\n")
              for role in ("CONTROL", "BAD", "REVERT"):
                  r = receipt[role]
                  fh.write(
                      f"| {role} | {r['keyring_unit_active']} | "
                      f"{r['portal_wants_keyring']} | {r['not_in_initialization']} |\n"
                  )
              fh.write("\n")
              fh.write("Historical GHCR artifacts are unavailable; this verdict is explicitly controlled-causal, not an original historical-image replay.\n")

          if not controlled_causal_witness:
              raise SystemExit("Controlled causal signature did not match expected Y -> Y' -> Y shape")
          PY

      - name: Upload CounterProof receipt
        uses: actions/upload-artifact@v4
        with:
          name: bluefin-4539-controlled-causal-receipt
          path: bluefin-4539-controlled-receipt.json
          if-no-files-found: error
